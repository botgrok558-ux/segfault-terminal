<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13161f"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="440" fill="url(#glow)"/>
  <!-- antenna -->
  <line x1="512" y1="210" x2="512" y2="130" stroke="#ff4d6d" stroke-width="26" stroke-linecap="round"/>
  <circle cx="512" cy="112" r="34" fill="#ff9f1c"/>
  <!-- head -->
  <rect x="192" y="200" width="640" height="560" rx="150" fill="url(#face)"/>
  <!-- screen -->
  <rect x="262" y="290" width="500" height="380" rx="90" fill="#0b0d12"/>
  <!-- X eyes -->
  <g stroke="#ff4d6d" stroke-width="34" stroke-linecap="round">
    <line x1="340" y1="380" x2="430" y2="470"/>
    <line x1="430" y1="380" x2="340" y2="470"/>
    <line x1="594" y1="380" x2="684" y2="470"/>
    <line x1="684" y1="380" x2="594" y2="470"/>
  </g>
  <!-- cursor mouth -->
  <rect x="452" y="560" width="120" height="30" rx="8" fill="#ff9f1c"/>
  <!-- crack -->
  <path d="M770 222 L728 268 L758 292 L716 336" fill="none" stroke="#0b0d12" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="512" y="905" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-weight="800" font-size="118" fill="#f5f5f7" letter-spacing="4">$SEGFAULT</text>
</svg>
